[versions]
agp = "9.3.1"
kotlin = "2.4.10"
detekt = "1.23.8"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.14.0"
constraintlayout = "2.2.2"
navigationFragmentKtx = "2.9.8"
navigationUiKtx = "2.9.8"
onnxruntimeAndroid = "1.22.0"
opencvVersion = "5.0.0.1"
