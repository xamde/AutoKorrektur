version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - AUTOKORREKTUR_REDIS_URL=redis://:${REDIS_PASSWORD:-autokorrektur_secret}@redis:6379/0
      - AUTOKORREKTUR_ENABLE_SDXL_LOAD=false
      - AUTOKORREKTUR_STRICT_INTEGRITY_CHECK=false
    depends_on:
      - redis
    networks:
      - autokorrektur-net
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-autokorrektur_secret}
    networks:
      - autokorrektur-net
    restart: always

networks:
  autokorrektur-net:
    driver: bridge
