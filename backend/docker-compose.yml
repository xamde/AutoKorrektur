version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - AUTOKORREKTUR_REDIS_URL=redis://:${REDIS_PASSWORD:-autokorrektur_secret}@redis:6379/0
      - AUTOKORREKTUR_ENABLE_SDXL_LOAD=false
      - AUTOKORREKTUR_STRICT_INTEGRITY_CHECK=false
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - autokorrektur-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-autokorrektur_secret}
    networks:
      - autokorrektur-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-autokorrektur_secret}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: always

networks:
  autokorrektur-net:
    driver: bridge
