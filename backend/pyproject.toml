[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autokorrektur-backend"
version = "1.0.0"
description = "FastAPI backend for AutoKorrektur SDXL photorealistic inpainting service"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Konrad Völkel", email = "mail@konradvoelkel.com" }
]
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
    "httpx>=0.25.0",
    "icontract>=2.7.0",
    "pydantic-settings>=2.0.0",
    "redis>=5.0.0",
    "pillow>=10.0.0",
    "numpy>=2.4.6",
    "torch>=2.2.0",
    "diffusers>=0.39.0",
    "transformers>=5.14.1",
    "accelerate>=1.14.0",
    "nvidia-cudnn-cu12",
    "onnxruntime>=1.28.0",
    "opencv-python-headless>=5.0.0.93",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "N", "UP"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers"
testpaths = ["."]
