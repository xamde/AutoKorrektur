[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autokorrektur-backend"
version = "1.0.0"
description = "FastAPI backend for AutoKorrektur SDXL photorealistic inpainting service"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Konrad Völkel", email = "mail@konradvoelkel.com" }
]
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
    "httpx>=0.25.0",
    "icontract>=2.7.0",
    "redis>=5.0.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "N", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers"
testpaths = ["."]
