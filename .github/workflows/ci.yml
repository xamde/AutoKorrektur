name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv and cache dependencies
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install backend dependencies
        # --extra dev pulls in pytest/pytest-cov (backend/pyproject.toml's
        # [project.optional-dependencies] dev group) — without it `uv sync` only installs the
        # runtime dependencies and the next step's `pytest` invocation fails with
        # "Failed to spawn: pytest ... No such file or directory". Restores behavior lost when
        # this step was reorganized in 96b540a (switched --directory backend --extra dev to
        # --project backend, silently dropping --extra dev) — pre-existing since before this
        # session, unrelated to any of today's changes.
        run: uv sync --project backend --extra dev

      - name: Run Backend Pytest Suite with Coverage
        run: |
          uv run --project backend pytest backend/test_server.py backend/test_benchmark_ml.py --cov=backend

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Product flavors were introduced in docs/MVP_FEATURE_FLAG_PLAN.md; CI validates the
      # `full` flavor (all FEATURE_* flags true, all ABIs) since it's the only one that
      # exercises every code path and matches the pre-flavor app exactly — no coverage
      # regression from adding flavors. `core` (the actual Play Store candidate) is validated
      # separately below via its release bundle build.
      - name: Run Android Lint
        run: ./gradlew lintFullDebug

      - name: Run Android Unit Tests & Generate JaCoCo Coverage
        run: ./gradlew testFullDebugUnitTest jacocoTestReport

      - name: Upload Test & Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            app/build/reports/tests/
            app/build/reports/jacoco/
            app/build/reports/lint-results-fullDebug.html
          if-no-files-found: ignore

      - name: Enable KVM group perms for Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Headless Android Emulator Instrumented Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedFullDebugAndroidTest

      - name: Build Production Release App Bundle (AAB)
        run: ./gradlew :app:bundleCoreRelease

      - name: Upload Release App Bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-app-bundle
          path: app/build/outputs/bundle/coreRelease/*.aab
          if-no-files-found: ignore
